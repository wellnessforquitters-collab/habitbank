:root{--bg:#fff;--fg:#000;--muted:#707070;--soft:#e6e6e6;--chip:#f3f3f3;--acc:#e8322e;--accsoft:#f8d3d1;
  --sans:Geist,-apple-system,"Helvetica Neue",Arial,sans-serif;--script:"Mrs Saint Delafield","Snell Roundhand",cursive;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--sans);letter-spacing:-.005em;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{height:34px;width:auto;display:block}
.hbtn{font:inherit;font-size:14px;background:none;border:1px solid var(--fg);width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--fg);flex:none}
h1{font-weight:500;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;letter-spacing:-.03em;text-transform:lowercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--acc)}
h2{font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
.kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.stat b{font-weight:600;font-size:22px;margin-right:4px;letter-spacing:-.02em}
.stat .r b{color:var(--acc)}
button{font:inherit;color:inherit}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;font-size:16px;padding:13px 20px;border:1px solid var(--fg);background:var(--fg);color:#fff;cursor:pointer;text-decoration:none;border-radius:0;font-weight:500}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.red{background:var(--acc);border-color:var(--acc)}
.btn:disabled{opacity:.3}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}

.bars{display:flex;gap:10px;align-items:flex-end;height:110px;border-bottom:2px solid var(--fg);padding:0 4px}

.inst ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:15px}
.inst ol li{display:flex;gap:10px;align-items:center}.inst ol li b{font-weight:600}
.inst ol .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--fg);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.inst ol svg{width:18px;height:18px;vertical-align:-3px}
.inst .ia{display:flex;gap:16px;align-items:center}

/* install visual */
.iv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:6px}
.ivs{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.ivt{width:100%;max-width:96px;height:112px;border:1.5px solid var(--fg);border-radius:12px;background:#fafafa;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.arr{margin-top:46px;font-size:16px}
.ivt .bar{height:34px;flex:none;width:100%;background:#fff;border-top:1px solid #ddd;display:flex;flex-direction:row;align-items:center;justify-content:space-around;padding:0 6px}
.ivt .bar i{width:14%;height:3px;background:#ccc;border-radius:2px}
.ivt .bar.top{position:absolute;top:0;left:0;right:0;border-top:0;border-bottom:1px solid #ddd;justify-content:space-between}
.ivt .bar .url{flex:1;height:8px;background:#e8e8e8;border-radius:4px;margin-right:6px}
.ivt .hl{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px var(--acc);display:flex;align-items:center;justify-content:center;color:var(--fg);font-size:14px;animation:pulse2 1.6s ease-in-out infinite}
.ivt .hl svg{width:15px;height:15px}
@keyframes pulse2{50%{box-shadow:0 0 0 5px rgba(232,50,46,.25)}}
.ivt .menu{background:#fff;border-top:1px solid #ddd;padding:6px 6px 8px;display:flex;flex-direction:column;gap:5px;border-radius:10px 10px 0 0}
.ivt .menu i{height:7px;background:#e8e8e8;border-radius:3px}
.ivt .menu .row{min-width:0;display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:4px;box-shadow:0 0 0 1.5px var(--acc);font-size:8px;color:var(--fg)}
.ivt .menu .row svg{width:11px;height:11px;flex:none}.ivt .menu .row em{font-style:normal;white-space:nowrap;overflow:hidden}
.ivt .home{position:absolute;inset:12px 10px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ivt .home i,.ivt .home b{aspect-ratio:1;border-radius:6px;background:#e3e3e3}
.ivt .home b{background:#000;color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:400;font-size:12px;animation:cellpop 1.6s ease-in-out infinite}
.inst .note{margin:0;font-size:12px;color:var(--muted);text-align:center}
/* landing tier hint */
.ltiers{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:-6px;font-size:12px;color:#9a9a9a}
.ltiers span{margin-left:6px}
.mini{width:26px;height:17px;border-radius:3px;display:inline-block}
.mini.black{background:#000}.mini.silver{background:linear-gradient(135deg,#eceef1,#b9bcc2 45%,#f4f5f7 60%,#a4a8ae)}
.mini.gold{background:linear-gradient(135deg,#f6e3a8,#c99a3c 45%,#f9e8b3 60%,#a8792a)}.mini.metal{background:linear-gradient(135deg,#4a4c52,#1a1b1e 45%,#55585f 60%,#111214)}

/* ===== landing clean pass ===== */
.lwrap{gap:104px}
.lhero{gap:26px}
.lcard{box-shadow:0 14px 30px -20px rgba(0,0,0,.45)}
.ltl{border-top:1px solid var(--fg)}
.lsec{gap:22px}
.lsec .kick{margin:0 0 -8px}
.rule{border:1px solid var(--fg)}
.rt{padding:30px 10px 22px}
.rt+.rt{border-left:1px solid var(--fg)}
.rt .bigbx{border-width:2px}
.rt.hit .bigbx{border-color:#f3b9b6;background:#fdeceb}
.lstart{justify-content:flex-start;gap:10px}
.ltiers{justify-content:flex-start;margin-top:-10px}
.lgrid i{border-color:#e4e4e4}
.lgrid i.miss{border-color:#f6cfcc;background:#fdeceb}
.lchart{border-left:1px solid var(--fg);border-bottom:1px solid var(--fg)}
.rcpt{border:1px solid var(--fg);box-shadow:none;max-width:none;padding:22px 20px 20px}
.rcpt .hd{border-bottom:1px solid var(--fg)}
.rcpt .tot{border-top:1px solid var(--fg)}
.lend{gap:18px}
.lend .closing{font-size:58px;margin:0 0 4px}

/* ===== install block, compact ===== */
.inst{border:1px solid var(--fg);padding:16px 14px 14px;gap:14px}
.inst .tag{font-size:11px;top:-8px}
.inst .ih{gap:12px}
.inst .ic{width:38px;height:38px;border-radius:9px;font-size:14px;box-shadow:none}
.inst .it{font-size:14px;line-height:1.3}.inst .it small{font-size:12px;margin-top:1px}
.iv{gap:4px;max-width:320px;margin:0 auto;width:100%}
.ivs{gap:6px;font-size:11px}
.ivt{max-width:74px;height:86px;border-width:1px;border-radius:10px;background:#fff}
.arr{margin-top:34px;font-size:13px;color:var(--muted)}
.ivt .bar{height:26px}
.ivt .hl{width:20px;height:20px;box-shadow:0 0 0 1.5px var(--acc)}
.ivt .hl svg{width:12px;height:12px}
@keyframes pulse2{50%{box-shadow:0 0 0 1.5px var(--acc),0 0 0 4px rgba(232,50,46,.15)}}
.ivt .menu{padding:5px 5px 6px;gap:4px}
.ivt .menu i{height:5px}
.ivt .menu .row{font-size:7px;padding:2px 3px;box-shadow:0 0 0 1px var(--acc)}
.ivt .menu .row svg{width:9px;height:9px}
.ivt .home{inset:10px 8px auto;gap:6px}
.ivt .home i{background:#ededed}
.ivt .home b{font-size:10px;border-radius:5px}
.inst .note{font-size:11px}

.inst{margin-top:16px;padding:22px 18px 18px;gap:18px}
.iv{gap:6px}

/* week table: 7 days fit the screen */
.tk-wrap{overflow:hidden}
.tk.wk{width:100%;table-layout:fixed}
.tk.wk th,.tk.wk td.d{min-width:0;width:auto}
.tk.wk .nm{width:34%;min-width:0;max-width:none}
.tk.wk th{height:44px;line-height:1.1}
.tk.wk th small{display:block;font-size:9px;letter-spacing:.08em;color:#aaa;text-transform:uppercase;margin-bottom:2px}
.tk.wk th.perfect small,.tk.wk th.today small{color:inherit;opacity:.8}
.tk.wk tr.add td{height:44px}

/* game bits */
.gtag{font-size:12px;letter-spacing:.06em;color:var(--acc);margin-left:8px;font-weight:500}
.tdy .nm2 small.stk{display:block;font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:0}
.card .tier.bk{color:#ff6b66;opacity:1}
</style>
</head>

/* ===== state ===== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return iso(d)};
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")||d}catch(e){return d}};
const START=1000,VALUE=100;
let H=Object.assign({unlocked:false,key:"",start:START,rows:[],checks:{},onboarded:false,seen:"",updated:0},load("habitbank",{}));
H.start=START;if(!H.seed){H.seed=Math.floor(Math.random()*1e9)}if(!H.passes)H.passes=0;if(!H.sick)H.sick={};if(!H.spent)H.spent=[];H.rows.forEach(r=>{if(!r.value)r.value=VALUE});delete H.reward;
const pack=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unpack=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/")))));
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const myLink=()=>location.origin+location.pathname+"#b="+pack(H);
const save=(touch=true)=>{if(touch)H.updated=Date.now();try{localStorage.setItem("habitbank",JSON.stringify(H))}catch(e){}
  if(IOS&&H.unlocked){try{history.replaceState(null,"",myLink())}catch(e){}}};
(function fromLink(){const h=location.hash;if(!h.startsWith("#b="))return;
  try{const d=unpack(h.slice(3));if(d&&d.rows&&(!H.updated||(d.updated||0)>H.updated)){H=Object.assign(H,d);save(false)}}catch(e){}})();
if(IOS){const m=document.querySelector('link[rel="manifest"]');if(m)m.remove()}
const G=load("goalgrid",null); // the free goal grid, used only for habit ideas

/* ===== money ===== */
const money=n=>(n<0?"−$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const active=(r,day)=>day>=r.from&&(!r.to||day<r.to);
const done=(r,day)=>!!((H.checks[r.id]||{})[day]);
// balance at the end of a given day (past days count misses; today counts only ticks)
/* game rules: streak interest, double pay days, sick days */
const SICK_PRICE=300;
const isSick=k=>!!(H.sick||{})[k];
const dbl=k=>{let h=2166136261^(H.seed||7);for(const ch of k){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return ((h>>>0)%9)===0};
const streakAt=(r,k)=>{let n=0,d=k;while(d>=r.from&&active(r,d)&&(done(r,d)||isSick(d))){if(done(r,d))n++;d=addDays(d,-1)}return n};
const bonusFor=n=>n>=30?.25:n>=7?.1:0;
const earnOn=(r,k)=>Math.round(r.value*(1+bonusFor(streakAt(r,k)))*(dbl(k)?2:1));
const nextEarn=(r,k)=>Math.round(r.value*(1+bonusFor(streakAt(r,addDays(k,-1))+1))*(dbl(k)?2:1));
const loseOn=(r,k)=>isSick(k)?0:r.value;
function balanceAt(day){let b=H.start;const t=today();
  H.rows.forEach(r=>{let d=r.from;while(d<=day){if(active(r,d)){if(done(r,d))b+=earnOn(r,d);else if(d<t)b-=loseOn(r,d)}d=addDays(d,1)}});
  (H.spent||[]).forEach(x=>{if(x.d<=day)b-=x.a});return b}
const balanceNow=()=>balanceAt(today());

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)}
const hapt=(()=>{let lab;return()=>{try{if(navigator.vibrate){navigator.vibrate(12);return}
  if(!lab){const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");i.id="hx";i.style.display="none";lab=document.createElement("label");lab.htmlFor="hx";lab.style.display="none";document.body.append(i,lab)}lab.click()}catch(e){}}})();
function coin(el,txt,minus){const r=el.getBoundingClientRect(),c=document.createElement("div");c.className="coin";c.textContent=txt;c.style.left=(r.left+r.width/2-16)+"px";c.style.top=(r.top-4)+"px";c.style.color=minus?"#e8322e":"#000";document.body.append(c);setTimeout(()=>c.remove(),950)}

let lastBal=null,justKey=null;
const blip=(()=>{let ctx;return up=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=up?1046:520;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.12);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.13)}catch(e){}}})();
function countUp(el,from,to){if(from===null||from===to){el.textContent=money(to);return}const t0=performance.now(),d=550;
  const step=now=>{const p=Math.min(1,(now-t0)/d),e=1-Math.pow(1-p,3);el.textContent=money(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
const perfect=k=>{const rs=H.rows.filter(r=>active(r,k));return rs.length>0&&rs.every(r=>done(r,k))};
function tickFx(r,k,on){justKey=on?r.id+"|"+k:null;blip(on);if(on)hapt();
  if(on&&k===today()&&perfect(k))setTimeout(()=>{toast("perfect day ✦");hapt()},350)}
const MONTHS=["january","february","march","april","may","june","july","august","september","october","november","december"];
const daysIn=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo,0).getDate()};
const shiftM=(m,d)=>{const[y,mo]=m.split("-").map(Number);const x=new Date(y,mo-1+d,1);return x.getFullYear()+"-"+pad(x.getMonth()+1)};

const weekStart=k=>{const d=new Date(k+"T12:00");return addDays(k,-((d.getDay()+6)%7))};

function weekBars(m){const n=daysIn(m),[y,mo]=m.split("-").map(Number),t=today(),weeks=[];let cur=[];
  for(let day=1;day<=n;day++){cur.push(day);const dow=new Date(y,mo-1,day).getDay();if(dow===0||day===n){weeks.push(cur);cur=[]}}
  return weeks.map(ds=>{let dn=0,poss=0,has=false,curW=false;
    ds.forEach(day=>{const k=m+"-"+pad(day);if(k>t)return;if(k===t)curW=true;H.rows.forEach(r=>{if(!active(r,k))return;poss++;if(done(r,k))dn++})});has=poss>0;
    return{pct:poss?Math.round(dn/poss*100):0,has,curW,label:ds[0]+"–"+ds[ds.length-1]}})}

      <div class="ln">earned ${money(gain)}${isSick(yd)?" · sick day, nothing lost ✦":lost?` · lost <b>${money(lost)}</b> (${missed.map(esc).join(", ")})`:" · nothing lost ✦"}</div>
      ${lost&&H.passes>0&&!isSick(yd)?`<button class="link" id="sickY" style="align-self:flex-start">were you sick? use a sick day (${H.passes} left)</button>`:""}
      <button class="link" id="seen" style="align-self:flex-start">got it</button></div>`}
  const tRows=H.rows.filter(r=>active(r,t));
  h+=`<div><h2 style="margin-bottom:8px">today${isSick(t)?' <span class="gtag">✦ sick day · nothing will be lost</span>':dbl(t)?' <span class="gtag">✦ double pay day</span>':""}</h2><div class="todaylist">${tRows.map(r=>`<button class="tdy${done(r,t)?" on":""}${justKey===r.id+"|"+t?" just":""}" data-t="${r.id}"><span class="bx">${TICK}</span><span class="nm2">${esc(r.name)}${(()=>{const st=done(r,t)?streakAt(r,t):streakAt(r,addDays(t,-1));const b=bonusFor(done(r,t)?st:st+1);return st>=2?`<small class="stk">${st} days in a row${b?` · +${Math.round(b*100)}%`:""}</small>`:""})()}</span><span class="v">+${money(done(r,t)?earnOn(r,t):nextEarn(r,t))}</span></button>`).join("")}
    ${H.rows.filter(r=>!r.to).length<10?'<button class="tdy" id="add0" style="color:var(--muted)"><span class="bx" style="border-style:dashed;border-color:#bbb"></span><span class="nm2">add a habit</span><span></span></button>':""}</div>${H.passes>0&&!isSick(t)&&tRows.length?`<button class="link" id="sickT" style="margin-top:8px;font-size:13px">sick today? use a sick day (${H.passes} left)</button>`:""}</div>`;
  // week table (7 days, fits the screen, no sideways scroll)
  const days=[...Array(7)].map((_,i)=>addDays(viewW,i)),curW=viewW===weekStart(t);
  const dlab=k=>{const d=new Date(k+"T12:00");return MONTHS[d.getMonth()].slice(0,3)+" "+d.getDate()};
  h+=`<div class="top"><div><p class="kick" style="margin:0 0 2px">✦ ${curW?"this week":"week"}${curW?"":` <button class="link" id="tw" style="font-size:12px;margin-left:6px;letter-spacing:0;text-transform:none">back to this week</button>`}</p><h1 style="font-size:28px">${dlab(days[0])} – ${dlab(days[6])}</h1></div><div class="arrows"><button id="mp" aria-label="previous week">←</button><button id="mn" aria-label="next week">→</button></div></div>`;
  const rows=H.rows.filter(r=>r.from<=days[6]&&(!r.to||r.to>days[0]));
  h+=`<div class="tk-wrap" id="tkw"><table class="tk wk"><tr><th class="nm"></th>`;
  days.forEach((k,i)=>{const pf=k<=t&&perfect(k),d=new Date(k+"T12:00").getDate();h+=`<th class="${pf?"perfect":k===t?"today":""}"><small>${"mtwtfss"[i]}</small>${pf?"✦":d}</th>`});
  h+=`</tr>`;
  rows.forEach(r=>{let earned=0,dn=0,poss=0;days.forEach(k=>{if(!active(r,k)||k>t)return;poss++;if(done(r,k)){earned+=earnOn(r,k);dn++}else if(k<t)earned-=loseOn(r,k)});
    h+=`<tr><td class="nm" data-row="${r.id}">${esc(r.name)}<small>${earned>=0?"+":""}${money(earned)} · ${dn}/${poss}</small></td>`;
    days.forEach(k=>{const fut=k>t,off=!active(r,k),dn=done(r,k),miss=!fut&&!off&&!dn&&k<t&&!isSick(k);
      h+=`<td class="d${dn?" on":""}${justKey===r.id+"|"+k?" just":""}${miss?" miss":""}${off?" off":""}${fut?" future":""}${k===t?" today":""}" data-r="${r.id}" data-k="${k}">${TICK}</td>`});
    h+=`</tr>`});
  if(H.rows.filter(r=>!r.to).length<10)h+=`<tr class="add"><td class="nm" id="add">+ add a habit</td><td colspan="7" id="add2"></td></tr>`;
  h+=`</table></div>`+moodHTML()+settle;
  const wb=weekBars(m);
  h+=`<div><h2 style="margin-bottom:10px">weekly progress</h2><div class="bars">${wb.map(w=>`<div class="bar"><span>${w.has?w.pct+"%":""}</span><i class="${w.curW?"cur":""}" data-h="${w.pct}"></i></div>`).join("")}</div>
  <div class="barlab">${wb.map(w=>`<span>${w.label}</span>`).join("")}</div></div>`;
  // statement: last 5 days
  h+=`<div><h2>statement</h2><div class="tx">`;
  for(let i=0;i<3;i++){const k=addDays(t,-i);const items=H.rows.filter(r=>active(r,k));if(!items.length)continue;
    h+=`<div class="d">${i===0?"today":i===1?"yesterday":new Date(k+"T12:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"}).toLowerCase()}</div>`;
    items.forEach(r=>{const dn=done(r,k);h+=`<div class="r"><span>${esc(r.name)}</span><span class="p${dn?"":i===0?" pend":" minus"}">${dn?"+"+money(earnOn(r,k)):i===0?"pending":isSick(k)?"sick day":"−"+money(r.value)}</span></div>`})}
  h+=`</div></div>`;
  h+=`<button class="btn ghost" id="stmt">my monthly statement</button>
  <p class="closing">keep going.</p>
  <footer><button class="link" id="lk">save my link</button><button class="link" id="ed">how it works</button><button class="link" id="hs">add to home screen</button><button class="link" id="rs">start over</button></footer>`;
  $("#app").innerHTML=h;
  countUp($("#amt"),lastBal,bal);lastBal=bal;justKey=null;checkTier(bal);$("#card").onclick=openCard;bindMood();
  requestAnimationFrame(()=>{document.querySelectorAll(".bar i").forEach(i=>i.style.height=i.dataset.h+"%");const mb=document.querySelector(".mbar i");if(mb)mb.style.width=mb.dataset.w+"%"});
  if(scroll){const th=document.querySelector(".tk th.today"),w=$("#tkw");if(th&&w)w.scrollLeft=Math.max(0,th.offsetLeft-160)}
  $("#mp").onclick=()=>{viewW=addDays(viewW,-7);renderMain(false)};
  $("#mn").onclick=()=>{viewW=addDays(viewW,7);renderMain(false)};
  {const tw=$("#tw");if(tw)tw.onclick=()=>{viewW=weekStart(today());renderMain(false)}}
  {const w=$("#tkw");let sx=null,sy=null;w.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
   w.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){viewW=addDays(viewW,dx<0?7:-7);renderMain(false)}},{passive:true})}
  const a=$("#add"),a2=$("#add2");if(a)a.onclick=()=>addHabit();if(a2)a2.onclick=()=>addHabit();
  document.querySelectorAll(".tk td.d").forEach(el=>el.onclick=()=>{if(el.classList.contains("future")||el.classList.contains("off"))return;
    if(el.dataset.k<addDays(today(),-1)){toast("this day is closed. the money's already gone.");return}
    const r=H.rows.find(x=>x.id===el.dataset.r),k=el.dataset.k,c=H.checks[r.id]||(H.checks[r.id]={});
    const wasPast=k<today();
    if(c[k]){const v=earnOn(r,k)+(wasPast?loseOn(r,k):0);delete c[k];coin(el,"−"+money(v),true);tickFx(r,k,false)}else{c[k]=1;coin(el,"+"+money(earnOn(r,k)+(wasPast?loseOn(r,k):0)));tickFx(r,k,true)}
    save();const sl=$("#tkw").scrollLeft;renderMain(false);$("#tkw").scrollLeft=sl});
  document.querySelectorAll(".tk td.nm[data-row]").forEach(el=>el.onclick=()=>editHabit(el.dataset.row));
  document.querySelectorAll(".tdy[data-t]").forEach(el=>el.onclick=()=>{const r=H.rows.find(x=>x.id===el.dataset.t),k=today(),c=H.checks[r.id]||(H.checks[r.id]={});
    if(c[k]){const v=earnOn(r,k);delete c[k];coin(el.querySelector(".bx"),"−"+money(v),true);tickFx(r,k,false)}else{c[k]=1;coin(el.querySelector(".bx"),"+"+money(earnOn(r,k)));tickFx(r,k,true)}save();const sl=$("#tkw")?$("#tkw").scrollLeft:0;renderMain(false);if($("#tkw"))$("#tkw").scrollLeft=sl});
  const a0=$("#add0");if(a0)a0.onclick=()=>addHabit();
  const sn=$("#seen");if(sn)sn.onclick=()=>{H.seen=today();save();renderMain(false)};
  const useSick=k=>{if(H.passes<1)return;H.sick[k]=1;H.passes--;save();toast("sick day used. rest, nothing is lost ✦");renderMain(false)};
  {const a=$("#sickT");if(a)a.onclick=()=>useSick(today());const b=$("#sickY");if(b)b.onclick=()=>useSick(addDays(today(),-1))}
  if(dbl(t)&&H.dblSeen!==t&&!isSick(t)){H.dblSeen=t;save(false);setTimeout(()=>toast("✦ double pay day: everything pays ×2 today"),700)}
  $("#stmt").onclick=openStatement;$("#lk").onclick=openLink;$("#ed").onclick=()=>{H.setup=false;render()};$("#rs").onclick=openReset;$("#hs").onclick=openInstall;bindInstall();
}

const IDEAS=["10k steps","workout","8 hours of sleep","in bed by 11","wake up at 7","drink 2l of water","protein breakfast","no sugar","no alcohol","read 10 pages","skincare","journal","meditate","stretch","no phone in bed","study 1 hour","cook at home","cold shower","no takeout","pilates"];
function habitIdeas(q){const used=H.rows.filter(r=>!r.to).map(r=>r.name.toLowerCase());
  return IDEAS.filter(a=>!used.includes(a)&&(!q||a.includes(q))).slice(0,14)}
const PRICES=[50,100,250,500];
function priceHTML(cur){const custom=!PRICES.includes(cur);
  return `<h2>worth a day</h2><div class="chips" id="pv">${PRICES.map(v=>`<button class="chip${v===cur?" on":""}" data-v="${v}">$${v}</button>`).join("")}<button class="chip${custom?" on":""}" id="pc">custom price</button></div>
  <input class="f" id="pcv" type="number" inputmode="numeric" min="1" max="100000" placeholder="your price, $" value="${custom?cur:""}" style="${custom?"":"display:none"}">`}
function bindPrice(cur,set){document.querySelectorAll("#pv [data-v]").forEach(b=>b.onclick=()=>{set(+b.dataset.v);document.querySelectorAll("#pv .chip").forEach(x=>x.classList.toggle("on",x===b));$("#pcv").style.display="none"});
  $("#pc").onclick=()=>{document.querySelectorAll("#pv .chip").forEach(x=>x.classList.toggle("on",x.id==="pc"));const i=$("#pcv");i.style.display="";i.focus()};
  $("#pcv").oninput=e=>{const v=Math.round(+e.target.value);if(v>0)set(Math.min(v,100000))}}
function addHabit(){
  openSheet(`<h2>add a habit</h2><input class="f" id="hn" maxlength="30" placeholder="start typing${G?", or pick from your grid":""}" autocomplete="off"><div class="chips" id="sg" style="max-height:170px;overflow:auto"></div>
  ${priceHTML(VALUE)}
  <p class="small muted" style="margin:0">tick it and you earn it, skip it and you pay it.</p>
  <div class="row2"><button class="btn ghost" id="hx">${H.rows.length?"cancel":"later"}</button><button class="btn" id="ho">add</button></div>`);
  let val=VALUE;bindPrice(val,v=>val=v);
  const inp=$("#hn");
  const draw=()=>{const q=inp.value.trim().toLowerCase();$("#sg").innerHTML=habitIdeas(q).map(a=>`<button class="chip" data-g="${esc(a)}">${esc(a)}</button>`).join("");
    document.querySelectorAll("#sg [data-g]").forEach(b=>b.onclick=()=>{inp.value=b.dataset.g;draw()})};
  inp.oninput=draw;draw();setTimeout(()=>inp.focus(),50);
  $("#hx").onclick=closeSheet;
  $("#ho").onclick=()=>{const name=inp.value.trim();if(!name)return toast("name your habit");
    H.rows.push({id:"h"+Date.now().toString(36),name,value:val,from:today()});save();closeSheet();renderMain()};
}
function editHabit(id){const r=H.rows.find(x=>x.id===id);if(!r)return;
  openSheet(`<h2>${esc(r.name)}</h2><input class="f" id="er" maxlength="30" value="${esc(r.name)}">
  ${priceHTML(r.value)}
  <p class="small muted" style="margin:0">a new price counts for every day of this habit.</p>
  ${r.to?'<p class="small muted" style="margin:0">this habit is closed. its history stays in your balance.</p>':""}
  <div class="row2"><button class="btn ghost" id="ec">${r.to?"close":"stop this habit"}</button><button class="btn" id="es">save</button></div>`);
  let val=r.value;bindPrice(val,v=>val=v);
  $("#es").onclick=()=>{const v=$("#er").value.trim();if(v)r.name=v;r.value=val;save();closeSheet();renderMain(false)};
  $("#ec").onclick=()=>{if(!r.to){r.to=addDays(today(),1);save();toast("habit closed, history kept")}closeSheet();renderMain(false)};
}
function openLink(){const link=myLink();openSheet(`<h2>your link</h2><p class="small muted" style="margin:0">your whole account is inside it. save it in your notes and open it on any phone.</p>
  <input class="f" readonly id="mc" value="${esc(link)}" style="font-size:13px"><div class="row2"><button class="btn ghost" id="mx">close</button><button class="btn" id="mcp">copy</button></div>`);
  $("#mx").onclick=closeSheet;$("#mcp").onclick=()=>navigator.clipboard.writeText(link).then(()=>toast("copied ✦"),()=>{$("#mc").select();toast("select and copy")})}
function openReset(){openSheet(`<h2>start over?</h2><p class="small muted" style="margin:0">your habits, ticks and balance will be deleted. your key stays.</p>
  <div class="row2"><button class="btn ghost" id="rx">cancel</button><button class="btn red" id="ro">start over</button></div>`);
  $("#rx").onclick=closeSheet;$("#ro").onclick=()=>{H=Object.assign(H,{rows:[],checks:{},setup:false,seen:""});save();closeSheet();render()}}

/* ===== monthly statement image ===== */
async function openStatement(){
  try{await document.fonts.load('600 40px Geist');await document.fonts.load('400 40px Geist')}catch(e){}
  const m=viewM,[y,mo]=m.split("-").map(Number),n=daysIn(m),t=today(),W=1080,Hh=1920,c=document.createElement("canvas");c.width=W;c.height=Hh;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,Hh);x.fillStyle="#000";x.textAlign="left";
  const F=(w,s)=>w+" "+s+"px Geist, sans-serif";
  x.font=F(400,30);x.fillStyle="#707070";x.fillText("HABIT BANK · MONTHLY STATEMENT",90,170);
  x.font=F(600,80);x.fillStyle="#000";x.fillText(MONTHS[mo-1]+" "+y,90,270);
  const endDay=(m+"-"+pad(n))<t?m+"-"+pad(n):t,end=balanceAt(endDay),start=balanceAt(addDays(m+"-01",-1)),chg=end-start;
  x.lineWidth=4;x.strokeRect(90,330,900,330);
  x.font=F(400,28);x.fillStyle="#707070";x.fillText("BALANCE",130,395);
  x.font=F(600,150);x.fillStyle=end<0?"#e8322e":"#000";x.fillText(money(end),125,545);
  x.font=F(500,38);x.fillStyle=chg<0?"#e8322e":"#000";x.fillText((chg>=0?"+":"")+money(chg)+" this month",130,615);
  let yy=760;x.font=F(400,28);x.fillStyle="#707070";x.fillText("BY HABIT",90,yy);yy+=30;
  H.rows.filter(r=>r.from<=m+"-"+pad(n)&&(!r.to||r.to>m+"-01")).slice(0,8).forEach(r=>{let e=0,dn=0;for(let d=1;d<=n;d++){const k=m+"-"+pad(d);if(!active(r,k)||k>t)continue;if(done(r,k)){e+=earnOn(r,k);dn++}else if(k<t)e-=loseOn(r,k)}
    yy+=70;x.strokeStyle="#e6e6e6";x.lineWidth=2;x.beginPath();x.moveTo(90,yy+22);x.lineTo(990,yy+22);x.stroke();
    x.font=F(400,40);x.fillStyle="#000";x.textAlign="left";x.fillText(r.name.toLowerCase().slice(0,26),90,yy);
    x.textAlign="right";x.fillStyle=e<0?"#e8322e":"#000";x.font=F(500,40);x.fillText((e>=0?"+":"")+money(e),990,yy);x.textAlign="left"});
  // weekly bars
  const wb=weekBars(m),bx=90,by=1700,bw=900,bh=260,gap=24,cw=(bw-gap*(wb.length-1))/wb.length;
  x.font=F(400,28);x.fillStyle="#707070";x.fillText("WEEKLY PROGRESS",90,by-bh-40);
  wb.forEach((w,i)=>{const hh=bh*w.pct/100;x.fillStyle="#e8322e";x.fillRect(bx+i*(cw+gap),by-hh,cw,hh);x.fillStyle="#707070";x.font=F(400,26);x.textAlign="center";x.fillText(w.has?w.pct+"%":"",bx+i*(cw+gap)+cw/2,by-hh-14)});
  x.textAlign="left";x.fillStyle="#000";x.fillRect(bx,by,bw,4);
  x.font=F(400,26);x.fillStyle="#707070";x.textAlign="center";x.fillText("@thewellnessforquitters",W/2,1840);
  c.toBlob(blob=>{const url=URL.createObjectURL(blob),file=new File([blob],"my-statement.png",{type:"image/png"}),canShare=navigator.canShare&&navigator.canShare({files:[file]});
    openSheet(`<div class="wall"><img src="${url}" alt="your monthly statement"></div>
    <div class="row2"><button class="btn ghost" id="wx">close</button>${canShare?'<button class="btn" id="ws">share</button>':`<a class="btn" href="${url}" download="my-statement.png">download</a>`}</div>`);
    $("#wx").onclick=closeSheet;const s=$("#ws");if(s)s.onclick=()=>navigator.share({files:[file]}).catch(()=>{})},"image/png");
}

render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
