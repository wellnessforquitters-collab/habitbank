<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDE5D5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F0E4;--panel:#FBF7EF;--soft:#EFE7D8;--line:#E4D9C6;--ink:#151413;--mut:#8C8273;
--y:#F2D25C;--yl:#FBF0C4;--yd:#3A3008;--p:#EBB3D6;--pl:#F8E1EF;--pd:#4A1A38;--g:#A6B56E;--gl:#E5EACF;--gd:#26300F;--b:#B3C5EF;--bl:#E4EAFB;--bd:#18264A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#EDE5D5}
body{color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;padding:14px;min-height:100vh}
.side{background:var(--ink);color:#F6F0E4;border-radius:22px;padding:26px 16px;position:sticky;top:14px;height:calc(100vh - 28px);display:flex;flex-direction:column}
.logo{font-size:26px;font-weight:600;letter-spacing:-.8px;padding:0 10px 26px;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--p);display:inline-block}
.side .lbl{font-size:12px;color:#8C8273;padding:0 10px 8px;margin-top:6px}
.side a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;color:#CFC6B6;text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px;position:relative}
.side a:hover{color:#fff;background:#232120}
.side a.cur{color:#fff}
.side a.cur:before{content:'';position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:#fff}
.side a svg{width:18px;height:18px;flex-shrink:0}
.side .dot{width:10px;height:10px;border-radius:4px;margin:0 4px}
.side .foot{margin-top:auto;font-size:12px;color:#8C8273;padding:0 10px;line-height:1.5}
.main{background:var(--bg);border-radius:22px;padding:26px 28px 40px;min-width:0}
.mtop{display:none;align-items:center;gap:10px;margin-bottom:16px}
.mtop button{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.scrim{display:none}
h1{font-size:34px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.sub{color:var(--mut);font-size:13px;margin-top:8px;max-width:620px;line-height:1.5}
h3{font-size:17px;font-weight:600;letter-spacing:-.3px}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:26px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.card{border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column}
.shape{position:absolute;right:-14px;top:-10px;width:130px;height:130px;opacity:.55;pointer-events:none}
.card h4{font-size:16px;font-weight:600;position:relative;letter-spacing:-.2px}
.nums{display:flex;gap:16px;margin-top:10px;position:relative}
.nums b{display:block;font-size:15px;font-weight:700}
.nums b small{font-size:11px;font-weight:600}
.nums span{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;opacity:.65}
.cy{background:var(--y);color:var(--yd);grid-column:span 2}.cp{background:var(--p);color:var(--pd);grid-column:span 3}
.cg{background:var(--g);color:var(--gd);grid-column:span 3}.cbl{background:var(--b);color:var(--bd);grid-column:span 2}
.bars{display:flex;align-items:flex-end;gap:7px;height:76px;margin-top:auto;padding-top:12px;position:relative}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars i{display:block;width:8px;border-radius:5px;background:currentColor;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bars i.fut{background:none;border:1.5px dashed currentColor;opacity:.55;height:60%}
.bars i.zero{height:4px!important;opacity:.35}
.bars em{font-style:normal;font-size:9.5px;opacity:.7}
.spark{margin-top:auto;position:relative}
.row2{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.pill{background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pill.light{background:var(--soft);color:var(--ink)}
.low{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.task{position:relative;overflow:hidden;border-radius:16px;background:var(--soft);margin-bottom:8px;cursor:pointer;user-select:none;display:block;width:100%;text-align:left}
.task>i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .9s cubic-bezier(.45,0,.2,1)}
.task.on>i{width:100%}
.task .in{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px}
.task .ic{width:32px;height:32px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s}
.task .ic svg{width:16px;height:16px}
.task .tt{font-size:13px;font-weight:600}
.task .ts{font-size:11px;color:var(--mut)}
.task .tag{margin-left:auto;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--panel)}
.task.on .tt{text-decoration:line-through;text-decoration-thickness:1.5px}
.mood{background:var(--p);color:var(--pd);border-radius:20px;padding:18px;position:relative;overflow:hidden}.mood .shape{width:110px;height:110px;right:-10px;top:-14px}
.mopts{display:flex;gap:8px;margin:14px 0 6px;position:relative}
.mopts button{flex:1;border-radius:14px;background:rgba(255,255,255,.45);padding:10px 4px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
.mopts button i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid var(--pd)}
.mopts button.sel{background:var(--pd);color:#fff}
.mopts button.sel i{border-color:#fff}
.mhist{display:flex;gap:4px;margin-top:14px;position:relative}
.mhist span{flex:1;height:26px;border-radius:6px;background:rgba(255,255,255,.4)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:12px;margin-top:14px;position:relative}
.kv dt{opacity:.65}.kv dd{font-weight:600}
.right .calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.right .calh .pill{background:var(--pl);color:var(--pd);padding:5px 12px}
.ib{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ib:hover{background:var(--soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:10.5px;color:var(--mut);font-weight:600;padding-bottom:6px}
.cal .d{height:34px;width:34px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;position:relative}
.cal .d.fut{color:#B9AE9C}
.cal .d.full{background:var(--ink);color:#fff}
.cal .d.part{background:var(--soft)}
.cal .d.today{background:var(--p);color:var(--pd)}
.cal .d.today.full{box-shadow:0 0 0 2px var(--ink) inset}
.wkl{margin-top:22px}
.wkl .it{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--line)}
.wkl .it:first-of-type{border-top:none}
.wkl .dn{width:34px;font-size:11px;color:var(--mut);font-weight:600}
.wkl .bx{flex:1;height:30px;border-radius:10px;background:var(--soft);position:relative;overflow:hidden}
.wkl .bx i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:10px;transition:width .6s}
.wkl .bx span{position:absolute;left:10px;top:7px;font-size:11px;font-weight:600;mix-blend-mode:difference;color:#fff}
.wkl .it.tdy .dn{color:var(--ink)}
.blk{width:100%;justify-content:center;padding:12px;margin-top:16px}
.panel{background:var(--panel);border-radius:20px;padding:20px}
.secs{display:grid;gap:14px;margin-top:24px}
.sp{border-radius:20px;padding:18px;background:var(--panel)}
.sph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sph b{font-size:16px;font-weight:600}
.sph .sw{width:14px;height:14px;border-radius:5px}
.ev{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;padding:10px 12px;border-radius:14px}
.ev>.evl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-right:6px}
.chip{font-size:12px;font-weight:600;padding:6px 6px 6px 11px;border-radius:999px;background:var(--panel);display:inline-flex;align-items:center;gap:4px}
.chip button{width:18px;height:18px;border-radius:50%;font-size:13px;line-height:1;color:var(--mut)}
.chip button:hover{background:var(--soft);color:var(--ink)}
.addi{border:1.5px dashed var(--line);border-radius:999px;padding:5px 11px;font-size:12px;background:transparent;outline:none;width:120px}
.addi:focus{border-color:var(--ink);border-style:solid}
.wg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wc{background:var(--bg);border-radius:14px;padding:8px;min-height:110px;display:flex;flex-direction:column;gap:6px}
.wc .wh{font-size:11px;font-weight:700;color:var(--mut);padding:2px 4px 4px}
.wc .wh.t{color:var(--ink)}
.wc .chip{border-radius:10px;justify-content:space-between;align-items:flex-start;line-height:1.3}
.wc .addi{width:100%;border-radius:10px}
@media(max-width:760px){.wg{grid-template-columns:1fr}.wc{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.wc .wh{width:34px}.wc .addi{width:120px}}
.bodyg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-top:24px}
.big{font-size:44px;font-weight:700;letter-spacing:-1.5px;position:relative}
.wf{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;position:relative}
.wf input{padding:9px 12px;border-radius:12px;border:none;background:rgba(255,255,255,.55);outline:none;width:110px}
.wf input[type=date]{width:150px}
.wlog{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;position:relative}
.wlog span{font-size:11px;font-weight:600;padding:4px 4px 4px 9px;border-radius:999px;background:rgba(255,255,255,.5);display:inline-flex;align-items:center;gap:4px}
.wlog button{width:16px;height:16px;border-radius:50%;font-size:12px;line-height:1}
.dtabs{display:flex;gap:6px;margin:14px 0 16px;flex-wrap:wrap}
.dtabs button{padding:8px 13px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700}
.dtabs button.sel{background:var(--ink);color:#fff}
.dtabs button.tdy:not(.sel){box-shadow:0 0 0 1.5px var(--ink) inset}
.ex{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.ex:first-child{border-top:none}
.ex .en{flex:1;min-width:0}
.ex .en b{display:block;font-size:14px;font-weight:600}
.ex .en span{font-size:12px;color:var(--mut)}
.sets{display:flex;gap:5px}
.set{width:30px;height:30px;border-radius:9px;background:var(--soft);position:relative;overflow:hidden;cursor:pointer}
.set i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--p);transition:height .7s cubic-bezier(.45,0,.2,1)}
.set.on i{height:100%}
.set span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--mut)}
.set.on span{color:var(--pd)}
.exf{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.exf input{padding:9px 12px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;outline:none}
.exf input:focus{border-color:var(--ink);border-style:solid}
.del{width:24px;height:24px;border-radius:50%;color:var(--mut);font-size:15px}
.del:hover{background:var(--soft);color:var(--ink)}
.ttop{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:12px;margin-top:22px;align-items:center}
.donut{display:flex;flex-direction:column;align-items:center;gap:6px}
.donut span{font-size:11px;color:var(--mut);font-weight:600}
.tchart{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:14px}
.hb{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:12px;font-weight:600}
.hb .lab{width:78px}
.hb .tr{flex:1;height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px;transition:width .6s}
.sheet{overflow-x:auto;margin-top:14px;border-radius:20px;background:var(--panel);padding:16px}
.sheet table{border-collapse:separate;border-spacing:0;font-size:12px}
.sheet th{font-weight:600;color:var(--mut);font-size:10.5px;padding:4px 0;text-align:center}
.sheet th.wk{color:var(--ink);font-size:11px;background:var(--soft);border-radius:8px}
.sheet td{padding:3px 2px;text-align:center}
.sheet td.nm{text-align:left;padding-right:10px;white-space:nowrap;font-weight:600;position:sticky;left:-16px;background:var(--panel);padding-left:2px}
.sheet td.cat span{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid #CFC3AF;display:inline-block;position:relative;overflow:hidden;cursor:pointer;vertical-align:middle;transition:border-color .3s}
.cb i{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .6s cubic-bezier(.45,0,.2,1)}
.cb.on i{height:100%}
.cb.fut{opacity:.35;cursor:default}
.cb svg{position:absolute;inset:0;margin:auto;opacity:0;transition:opacity .2s .35s}
.cb.on svg{opacity:1}
th.tdy{color:var(--ink)!important}
td.gap,th.gap{width:8px}
.pg{width:120px;padding-left:12px!important}
.pg div{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--mut)}
.pg .tr{flex:1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pg .tr i{display:block;height:100%;border-radius:4px}
.cons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.cons .c{border-radius:20px;padding:16px;position:relative;overflow:hidden}
.cons .c b{font-size:30px;font-weight:700;letter-spacing:-1px;display:block;margin-top:6px;position:relative}
.cons .c span{font-size:12px;font-weight:600;opacity:.75;position:relative}
.addh{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.addh input,.addh select{padding:9px 12px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;outline:none}
.mnav{display:flex;align-items:center;gap:6px}
.empty{color:var(--mut);font-size:13px;padding:18px 4px}
.trust{background:var(--ink);color:#F6F0E4;border-radius:20px;padding:18px 18px 16px;margin-bottom:24px}
.trust .th{display:flex;justify-content:space-between;align-items:baseline}
.trust .th b{font-size:16px;font-weight:600}
.trust .th span{font-size:11px;color:#8C8273;font-weight:600}
.trust svg{display:block;width:100%;max-width:260px;margin:6px auto 0}
#sdraw{transition:stroke-dashoffset 1.4s cubic-bezier(.45,0,.2,1)}
.trust .kept{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;margin-top:4px}
.trust .kept b{font-size:20px;font-weight:700;color:#fff}
.trust .rem{margin-top:12px;padding:12px 14px;border-radius:14px;background:#262321;font-size:13px;line-height:1.45}
.trust .rem small{display:block;font-size:10.5px;color:#8C8273;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.steps ol{padding-left:18px;line-height:1.7;font-size:13px}
.stat{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;padding:8px 0}
.stat i{width:10px;height:10px;border-radius:50%;display:inline-block}
.bk{width:100%;min-height:90px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;padding:10px 12px;font-size:12px;font-family:ui-monospace,monospace;outline:none;resize:vertical;margin-top:10px}
.bk:focus{border-color:var(--ink);border-style:solid}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{font-size:12px;font-weight:600;margin-top:8px;min-height:16px}
.banner{display:flex;align-items:center;gap:12px;background:var(--ink);color:#F6F0E4;border-radius:16px;padding:12px 14px;margin:14px 0 4px;font-size:13px;font-weight:600}
.banner a{color:#EBB3D6;margin-left:auto;white-space:nowrap}
@media(max-width:760px){.steps{grid-template-columns:1fr}}
.cal .d.sel{box-shadow:0 0 0 1.5px var(--ink) inset}
.cal .d:hover{box-shadow:0 0 0 1.5px var(--line2,#D9CDBE) inset}
.cal .d .odot{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#D886B6}
.cal .d.full .odot{background:#EBB3D6}
.oneoff{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.oneoff input,.oneoff select{padding:9px 12px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;outline:none;font-size:13px}
.oneoff input:focus{border-color:var(--ink);border-style:solid}
.olist .od{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
.olist .od:first-child{margin-top:0}
.sheetwrap{position:fixed;inset:0;z-index:50;background:rgba(21,20,19,.4);display:flex;align-items:center;justify-content:center;padding:20px}
.sheetc{background:var(--bg);border-radius:24px;width:min(580px,100%);max-height:88vh;overflow:auto;padding:22px 22px 26px}
@media(max-width:760px){.sheetwrap{align-items:flex-end;padding:0}.sheetc{border-radius:24px 24px 0 0;max-height:90vh;padding-bottom:calc(26px + env(safe-area-inset-bottom))}}
.ph{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ptitle{font-size:24px;font-weight:700;letter-spacing:-.6px}
.mut2{font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.titlein{font-size:22px;font-weight:700;border:none;border-bottom:1.5px dashed var(--line);background:transparent;outline:none;width:100%;padding:2px 0;letter-spacing:-.5px}
.bar2{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:14px 0 4px}
.bar2 i{display:block;height:100%;background:var(--p);border-radius:4px;transition:width .6s}
.blk2{padding:14px 0;border-top:1px dashed var(--line)}
.blk2:first-child{border-top:none}
.bh{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bh b{display:block;font-size:14px;font-weight:600}
.bh span{font-size:12px;color:var(--mut)}
.seg{position:relative;overflow:hidden;border-radius:12px;background:var(--soft);margin-top:6px;cursor:pointer;display:flex;gap:12px;padding:11px 12px;font-size:13px;user-select:none}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--p);transition:width .9s cubic-bezier(.45,0,.2,1)}
.seg.on i{width:100%}.seg span{position:relative}.seg.on span{color:var(--pd)}
.sgt{font-weight:700;min-width:84px}
.citems{margin:8px 0 10px 18px;font-size:13px;line-height:1.7}
.set.r{width:auto;min-width:70px}
.sets{flex-wrap:wrap}
.addb{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.addf{display:grid;gap:6px;margin-top:10px}
.addf input,.addf textarea{padding:9px 12px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;outline:none;font:inherit;font-size:13px;color:var(--ink)}
.addf textarea{min-height:96px;resize:vertical}
.addf input:focus,.addf textarea:focus{border-color:var(--ink);border-style:solid}

 return pts.reverse()}

 else body=`<div class="stat"><i style="background:${syncColor()}"></i>${syncLabel()} · ${esc(sbUser.email||'')}</div><div class="btns"><button class="pill" data-act="sbnow">Sync now</button><button class="pill light" data-act="sbout">Sign out</button></div>`;
 return `<details class="panel" style="margin-top:14px"${sbCfg.url?' open':''}><summary style="cursor:pointer;font-weight:600">Sync between devices</summary>${body}<div class="msg" style="color:${syncState==='error'?'#B3412A':'var(--mut)'}">${esc(syncMsg)}</div></details>`}
function vSave(){
 const ok=storageOk(),lb=S.lastBackup;
 const st=(c,t)=>`<div class="stat"><i style="background:${c}"></i>${t}</div>`;
 return `<h1>Save my tracker</h1><p class="sub">Sync your tracker between your phone and computer, and keep a backup.</p>${vSync()}
 <div class="panel" style="margin-top:14px;background:var(--ink);color:#F6F0E4"><h3 style="color:#fff">My link</h3>
 <p style="font-size:13px;line-height:1.55;margin-top:8px;color:#CFC6B6">This link carries your whole plan: tasks, days and workouts. Copy it, open it on your phone in Safari and add it to your Home Screen. Done.</p>
 <div class="btns"><button class="pill" data-act="copylink" style="background:#F6F0E4;color:var(--ink)">Copy my link</button></div><div class="msg" id="lmsg" style="color:#EBB3D6"></div>
 <details style="margin-top:10px"><summary style="font-size:12px;color:#8C8273;cursor:pointer">Changed your plan later? Paste the new link here</summary><textarea class="bk" id="linkin" placeholder="Paste your link" style="border-color:#3A3633;color:#F6F0E4"></textarea><div class="btns"><button class="pill" data-act="uselink" style="background:#F6F0E4;color:var(--ink)">Load this plan</button></div></details></div>
 <div class="panel" style="margin-top:22px"><h3>Status</h3>
 ${st(ok?'#A6B56E':'#E07A5F',ok?'Saving works on this device':'This browser is blocking storage, your ticks won\'t be kept')}
 ${st(STANDALONE?'#A6B56E':'#F2D25C',STANDALONE?'Opened as an app from your home screen':'Opened in the browser, not from the home screen icon')}
 ${PERSIST===true?st('#A6B56E','Protected storage is on'):''}
 ${st(lb?'#A6B56E':'#F2D25C',lb?`Last backup: ${lb}`:'No backup yet')}</div>
 <div class="steps"><div class="panel"><h3>iPhone</h3><ol style="margin-top:10px"><li>Open your link in <b>Safari</b></li><li>Tap <b>Share</b> (square with an arrow)</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b></li><li>From now on, open the tracker only from that icon</li></ol></div>
 <div class="panel"><h3>Android</h3><ol style="margin-top:10px"><li>Open your link in <b>Chrome</b></li><li>Tap <b>⋮</b> in the corner</li><li>Tap <b>Add to Home screen</b> or <b>Install app</b></li><li>Open the tracker from that icon</li></ol></div></div>
 <div class="panel" style="margin-top:14px;background:var(--yl);color:var(--yd)"><b>Important on iPhone:</b> the home screen app keeps its own data, separate from Safari. Ticks you make in a Safari tab won't show up in the app, so use only the icon.</div>
 <div class="panel" style="margin-top:14px"><h3>Backup</h3><p class="sub" style="margin-top:6px">Copy your backup once a week and keep it in Notes. If you change phones or the data ever gets cleared, paste it below and press Restore.</p>
 <div class="btns"><button class="pill" data-act="bkcopy">Copy backup</button><button class="pill light" data-act="bkfile">Download file</button></div>
 <textarea class="bk" id="bkin" placeholder="Paste a backup here to restore"></textarea>
 <div class="btns"><button class="pill light" data-act="bkrestore">Restore</button></div><div class="msg" id="bkmsg"></div></div>`}
function bkText(){const c=Object.assign({},S);return JSON.stringify(c)}
function bkMark(){S.lastBackup=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});save()}
function bkMsg(t,err){const m=document.getElementById('bkmsg');if(m){m.textContent=t;m.style.color=err?'#B3412A':'var(--gd)'}}
let restoreArmed=false;
function render(popSel){
 document.getElementById('side').innerHTML=side();
 document.getElementById('tabbar').innerHTML=[['dash','Today'],['plan','Plan'],['body','Body'],['everyday','Tracker'],['save','Save']].map(([k,l])=>`<a href="#${k}" class="${page===k?'cur':''}">${IC[k]}${l}</a>`).join('');
 document.getElementById('mtitle').textContent={dash:'Dashboard',plan:'Weekly plan',body:'Body',everyday:'Everyday tracker',save:'Save my tracker'}[page];
 document.getElementById('view').innerHTML={dash:vDash,plan:vPlan,body:vBody,everyday:vEveryday,save:vSave}[page]();
 const sd=document.getElementById('sdraw');if(sd){sd.getBoundingClientRect();requestAnimationFrame(()=>requestAnimationFrame(()=>sd.style.strokeDashoffset=sd.dataset.to))}
 drawSheet();
 if(page==='everyday'){const sh=document.querySelector('.sheet'),td=sh&&sh.querySelector('th.tdy');if(sh&&td&&sh.scrollWidth>sh.clientWidth)sh.scrollLeft=Math.max(0,td.offsetLeft-sh.clientWidth/2)}
 if(popSel){const el=document.querySelector(popSel);if(el)el.classList.add('pop')}
 const wf=document.getElementById('wform');if(wf)wf.onsubmit=e=>{e.preventDefault();const kg=parseFloat(String(document.getElementById('wkg').value).replace(',','.'));const d=document.getElementById('wd').value;if(!kg||!d)return;S.weights=S.weights.filter(x=>x.d!==d);S.weights.push({d,kg:Math.round(kg*10)/10});save();render()};
 const of=document.getElementById('oform');if(of)of.onsubmit=e=>{e.preventDefault();const t=document.getElementById('ot').value.trim();if(!t)return;S.tasks.push({id:uid(),t,sp:document.getElementById('osp').value,days:'once',date:iso(selDay),time:document.getElementById('otime').value||''});save();render()};
 const pf=document.getElementById('pform');if(pf)pf.onsubmit=e=>{e.preventDefault();const t=document.getElementById('pt').value.trim();const d=document.getElementById('pd').value;if(!t||!d)return;S.tasks.push({id:uid(),t,sp:document.getElementById('psp').value,days:'once',date:d,time:document.getElementById('ptime').value||''});save();render()};
 const hf=document.getElementById('hform');if(hf)hf.onsubmit=e=>{e.preventDefault();const n=document.getElementById('hn').value.trim();if(!n)return;S.tasks.push(T(n,document.getElementById('hs').value,'all'));save();render()};
}
function buzz(){try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
 if(act==='bkcopy'){const t=bkText();const done=()=>{bkMark();render();bkMsg('Backup copied. Paste it into Notes.')};try{navigator.clipboard.writeText(t).then(done,()=>{const b=document.getElementById('bkin');b.value=t;b.select();bkMsg('Copy the text in the box manually.',true)})}catch(e){const b=document.getElementById('bkin');b.value=t;b.select();bkMsg('Copy the text in the box manually.',true)}return}
 if(act==='bkfile'){try{const bl=new Blob([bkText()],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='tracker-backup-'+TI+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);bkMark();render();bkMsg('Backup file saved.')}catch(e){bkMsg('Download is blocked here. Use Copy backup instead.',true)}return}
 if(act==='bkrestore'){const v=document.getElementById('bkin').value.trim();if(!v){bkMsg('Paste a backup first.',true);return}let d;try{d=JSON.parse(v)}catch(e){bkMsg('That doesn\'t look like a tracker backup.',true);return}if(!d||!Array.isArray(d.tasks)||!d.checks){bkMsg('That doesn\'t look like a tracker backup.',true);return}if(!restoreArmed){restoreArmed=true;a.textContent='Tap again to replace current data';return}restoreArmed=false;S=d;save();render();bkMsg('Restored.');return}
 if(act==='pick'){selDay=fromIso(a.dataset.d);render();const l=document.querySelector('.low');if(l&&window.innerWidth<1180)l.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(act==='picktoday'){selDay=new Date(TODAY);render();return}
 if(act==='openwk'){sheet={i:+a.dataset.i,ds:a.dataset.d};wkEdit=!!a.dataset.new;addType=null;drawSheet();return}
 if(act==='closewk'){sheet=null;wkEdit=false;addType=null;render();return}
 if(act==='cell'){const k=a.dataset.ds+'|'+a.dataset.k;if(S.sets[k])delete S.sets[k];else{S.sets[k]=1;buzz()}syncWk(+a.dataset.i,a.dataset.ds);save();a.classList.toggle('on',!!S.sets[k]);setTimeout(render,850);return}
 if(act==='wkall'){const i=+a.dataset.i,ds=a.dataset.ds,c=wkCells(i),ck=ds+'|wk-'+i;const all=!!S.checks[ck];c.forEach(k=>{if(all)delete S.sets[ds+'|'+k];else S.sets[ds+'|'+k]=1});if(all)delete S.checks[ck];else{S.checks[ck]=1;buzz()}save();render();return}
 if(act==='wkedit'){wkEdit=!wkEdit;addType=null;render();return}
 if(act==='addtype'){addType=addType===a.dataset.t?null:a.dataset.t;render();const f=document.querySelector('.addf [data-f="n"]');if(f)f.focus();return}
 if(act==='delblk'){const w=S.wdays[+a.dataset.i];w.blocks=w.blocks.filter(b=>b.id!==a.dataset.id);save();render();return}
 if(act==='addblock'){const box=a.closest('.addf'),g=f=>{const x=box.querySelector(`[data-f="${f}"]`);return x?x.value.trim():''};const n=g('n'),t=a.dataset.t,w=S.wdays[+a.dataset.i];if(!n){box.querySelector('[data-f="n"]').focus();return}
  if(t==='ex')w.blocks.push(BL('ex',{n,sets:Math.max(1,Math.min(12,parseInt(g('sets'))||3)),reps:g('reps')||'12 reps'}));
  if(t==='int'){const segs=g('lines').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.+?)\s+[—–-]\s+(.+)$/)||l.match(/^(.+?)\s*[—–:]\s*(.+)$/);return m?{d:m[1].trim(),x:m[2].trim()}:{d:l,x:''}});if(!segs.length){box.querySelector('[data-f="lines"]').focus();return}w.blocks.push(BL('int',{n,segs}))}
  if(t==='circ'){const items=g('lines').split('\n').map(l=>l.trim()).filter(Boolean);if(!items.length){box.querySelector('[data-f="lines"]').focus();return}w.blocks.push(BL('circ',{n,rounds:Math.max(1,Math.min(12,parseInt(g('rounds'))||3)),items}))}
  addType=null;save();render();return}
 if(act==='addsp'){addSp=a.dataset.k;render();return}
 if(act==='addmode'){addMode=a.dataset.m;render();return}
 if(act==='pwp'){planWk=addD(planWk,-7);render();return}
 if(act==='pwn'){planWk=addD(planWk,7);render();return}
 if(act==='pwnow'){planWk=new Date(MON);planDay=dow(TODAY);render();return}
 if(act==='pday'){planDay=+a.dataset.i;render();return}
 if(act==='newtask'){const d=addD(planWk,planDay);sheet={type:'add',ds:iso(d),i:planDay};draft={t:'',time:''};drawSheet();setTimeout(()=>{const n=document.getElementById('nt');if(n)n.focus()},60);return}
 if(act==='addrep'){addRep=a.dataset.r;drawSheet();return}
 if(act==='addsubmit'){const n=document.getElementById('nt');if(n)draft.t=n.value;const t=draft.t.trim();if(!t){const m=document.getElementById('nmsg');if(m){m.textContent='Write the task first.';m.style.color='#B3412A'}if(n)n.focus();return}
  const i=sheet.i,ds=sheet.ds;if(addRep==='all')S.tasks.push(T(t,addSp,'all'));else if(addRep==='once')S.tasks.push({id:uid(),t,sp:addSp,days:'once',date:ds,time:draft.time||''});else{const ex=S.tasks.find(x=>isWeekly(x)&&x.sp===addSp&&x.t.toLowerCase()===t.toLowerCase());if(ex){if(!ex.days.includes(i)){ex.days.push(i);ex.days.sort()}}else S.tasks.push(T(t,addSp,[i]))}
  save();buzz();sheet=null;draft={t:'',time:''};render();return}
 if(act==='sbcfg'){const u=(document.getElementById('sburl').value||'').trim().replace(/\/+$/,''),k=(document.getElementById('sbkey').value||'').trim();if(!/^https:\/\/.+/.test(u)||k.length<20){syncMsg='Paste both the Project URL (starts with https://) and the anon public key.';syncState='error';render();return}sbCfg={url:u,key:k};try{localStorage.setItem('tracker-sb',JSON.stringify(sbCfg))}catch(e){}sb=null;syncState='loading';syncMsg='';render();sbInit();return}
 if(act==='sbin'||act==='sbup'){const em=(document.getElementById('sbem').value||'').trim(),pw=document.getElementById('sbpw').value||'';if(!em||pw.length<6){syncMsg='Enter your email and a password of at least 6 characters.';syncState='signedout';render();return}if(!sb){sbInit();syncMsg='Still connecting, try again in a second.';render();return}
  syncMsg=act==='sbin'?'Signing in…':'Creating account…';render();
  (act==='sbin'?sb.auth.signInWithPassword({email:em,password:pw}):sb.auth.signUp({email:em,password:pw})).then(({data,error})=>{if(error){syncState='signedout';syncMsg=error.message;render();return}
   if(data&&data.session){sbUser=data.session.user;syncMsg='';pull(true)}else{syncState='signedout';syncMsg='Account created. If Supabase asks you to confirm your email, confirm it, then press Sign in.';render()}}).catch(e=>{syncState='signedout';syncMsg=e.message||'Sign-in failed';render()});return}
 if(act==='sbout'){if(sb)sb.auth.signOut();sbUser=null;syncState='signedout';render();return}
 if(act==='sbnow'){pull(false);return}
 if(act==='sbreset'){sbCfg={url:'',key:''};try{localStorage.removeItem('tracker-sb')}catch(e){}sb=null;sbUser=null;syncState='off';syncMsg='';render();return}
 if(act==='copylink'){const l=myLink();const m=document.getElementById('lmsg');const ok=()=>{if(m)m.textContent='Link copied. Send it to your phone (Notes, Telegram, AirDrop) and open it in Safari.'};const fail=()=>{const b=document.getElementById('linkin');const d=b&&b.closest('details');if(d)d.open=true;if(b){b.value=l;b.select()}if(m)m.textContent='Copy the link from the box below.'};try{navigator.clipboard.writeText(l).then(ok,fail)}catch(e){fail()}return}
 if(act==='uselink'){const v=(document.getElementById('linkin').value||'').trim();const i=v.indexOf('#setup=');const m=document.getElementById('lmsg');const r=i<0?'bad':applySetup(v.slice(i+7));if(r==='ok'){render();const m2=document.getElementById('lmsg');if(m2)m2.textContent='Plan loaded.'}else if(m)m.textContent=r==='old'?'You already have this plan or a newer one.':'That doesn\'t look like your tracker link.';return}
 if(act==='menu'){document.getElementById('root').classList.toggle('open');return}
 if(act==='tg'){const k=a.dataset.d+'|'+a.dataset.id;if(S.checks[k])delete S.checks[k];else{S.checks[k]=1;buzz()}save();
  const on=!!S.checks[k];a.classList.toggle('on',on);if(a.classList.contains('cb'))a.style.borderColor=on?SP[S.tasks.find(t=>t.id===a.dataset.id).sp].hex:'';
  setTimeout(render,a.classList.contains('cb')?650:950);return}
 if(act==='mood'){const m=+a.dataset.m;if(S.moods[TI]===m)delete S.moods[TI];else S.moods[TI]=m;save();render();return}
 if(act==='calp'){calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);render();return}
 if(act==='caln'){calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);render();return}
 if(act==='trp'){trM=new Date(trM.getFullYear(),trM.getMonth()-1,1);render();return}
 if(act==='trn'){trM=new Date(trM.getFullYear(),trM.getMonth()+1,1);render();return}
 if(act==='deltask'){S.tasks=S.tasks.filter(t=>t.id!==a.dataset.id);save();render();return}
 if(act==='unday'){const t=S.tasks.find(t=>t.id===a.dataset.id);if(t){t.days=t.days.filter(i=>i!==+a.dataset.i);if(!t.days.length)S.tasks=S.tasks.filter(x=>x!==t)}save();render();return}
 if(act==='delw'){S.weights=S.weights.filter(w=>w.d!==a.dataset.d);save();render();return}
 if(act==='bday'){bodyDay=+a.dataset.i;wkEdit=false;addType=null;render();return}
});
document.addEventListener('keydown',e=>{
 const i=e.target.closest&&e.target.closest('[data-add]');if(!i||e.key!=='Enter')return;e.preventDefault();
 const d=i.dataset.d,dt=i.dataset.date;if(addFromInput(i)){render();const n=document.querySelector(`[data-add][data-d="${d}"]`);if(n)n.focus()}
});
document.addEventListener('focusout',e=>{const i=e.target.closest&&e.target.closest('[data-add]');if(!i||!i.value.trim())return;if(addFromInput(i))setTimeout(render,0)});
document.addEventListener('input',e=>{if(e.target.id==='nt')draft.t=e.target.value;if(e.target.id==='ntime')draft.time=e.target.value});
let lastMob=isMob();window.addEventListener('resize',()=>{if(isMob()!==lastMob){lastMob=isMob();render()}});
document.addEventListener('change',e=>{const t=e.target.closest&&e.target.closest('[data-wtitle]');if(!t)return;S.wdays[+t.dataset.wtitle].title=t.value.trim();save();render()});
window.addEventListener('hashchange',()=>{sheet=null;planWk=new Date(MON);planDay=dow(TODAY);wkEdit=false;addType=null;const h=location.hash.slice(1);if(['dash','plan','body','everyday','save'].includes(h)){page=h;document.getElementById('root').classList.remove('open');window.scrollTo(0,0);render()}});
render();
sbInit();
</script>
